name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No Pi install exists on the runner, so the host packages resolve from the
      # registry and test/link-deps.mjs skips linking.
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
